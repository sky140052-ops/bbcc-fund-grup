<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Outer Protective Shield -->
  <path d="M256 60 L390 120 C390 280 256 390 256 420 C256 390 122 280 122 120 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Contrast Shield -->
  <path d="M256 86 L368 136 C368 268 256 364 256 388 C256 364 144 268 144 136 Z" 
        fill="#0b1329" 
        opacity="0.92" />

  <!-- Emergency Medical Plus / Financial Aid Symbol -->
  <rect x="238" y="140" width="36" height="74" rx="8" fill="#10b981" />
  <rect x="219" y="159" width="74" height="36" rx="8" fill="#10b981" />

  <!-- DFI Main Monogram -->
  <text x="256" y="292" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="64" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="4">
    DFI
  </text>

  <!-- Rupee Symbol -->
  <circle cx="256" cy="336" r="22" fill="url(#goldGrad)" />
  <text x="256" y="344" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="24" 
        font-weight="bold" 
        fill="#000000" 
        text-anchor="middle">
    ₹
  </text>

  <!-- Subtitle Text -->
  <text x="256" y="470" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="26" 
        font-weight="bold" 
        fill="#94a3b8" 
        text-anchor="middle" 
        letter-spacing="2">
    इमरजेंसी सेवा
  </text>
</svg>
